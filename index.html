<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oferta</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#ffffff;
  color:#1e293b;
}

.container {
  max-width: 600px;
  margin:auto;
  padding:20px;
}

h1 {
  font-size:28px;
  line-height:1.3;
}

.sub {
  color:#64748b;
  margin:10px 0 20px;
}

.btn {
  display:block;
  background:#16a34a;
  color:#fff;
  padding:16px;
  text-align:center;
  font-weight:bold;
  border-radius:8px;
  text-decoration:none;
  margin:20px 0;
}

.section {
  margin:40px 0;
}

.card {
  background:#f1f5f9;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

.price-box {
  background:#0f172a;
  color:#fff;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

.price-old {
  text-decoration:line-through;
  opacity:0.6;
}

.price-now {
  font-size:32px;
  color:#22c55e;
  font-weight:bold;
}

img {
  width:100%;
  border-radius:10px;
}

.testimonial {
  display:flex;
  gap:10px;
  align-items:center;
}

.testimonial img {
  width:50px;
  height:50px;
  border-radius:50%;
}
</style>

</head>
<body>

<div class="container">

<!-- TOPO -->
<h1 id="title"></h1>
<p class="sub">Método simples para transformar a rotina do seu filho sem estresse</p>

<img src="https://raw.githubusercontent.com/rodosilvasouza-bit/meu-json/main/assests/images/mockup.jpeg" style="
  width:100%; 
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  margin:20px 0
  ">
  <img id="mockup">

<a id="ctaTop" class="btn" target="_blank"></a>

<!-- DOR -->
<div class="section">
<h3>Se você passa por isso:</h3>
<div id="painPoints"></div>
</div>

<!-- PROMESSA -->
<div class="section">
<h3>Você vai conseguir:</h3>
<div id="features"></div>
</div>

<!-- PROVA -->
<div class="section">
<h3>Resultados reais:</h3>
<div id="testimonials"></div>
</div>

<!-- OFERTA -->
<div class="section price-box">
<p class="price-old" id="priceOld"></p>
<p class="price-now" id="priceNow"></p>
<a id="ctaBottom" class="btn" target="_blank"></a>
</div>

<!-- BENEFÍCIOS -->
<div class="section">
<h3>Você recebe:</h3>
<div id="benefits"></div>
</div>

</div>

<script>
fetch('dados.json')
.then(res => res.json())
.then(data => {

  document.getElementById('title').innerHTML = data.title;
  document.getElementById('mockup').src = data.mockup;

  document.getElementById('ctaTop').innerText = data.ctaText;
  document.getElementById('ctaTop').href = data.ctaLink;

  document.getElementById('ctaBottom').innerText = data.ctaText;
  document.getElementById('ctaBottom').href = data.ctaLink;

  data.painPoints.forEach(item => {
    document.getElementById('painPoints').innerHTML += 
      `<div class="card">${item}</div>`;
  });

  data.features.forEach(item => {
    document.getElementById('features').innerHTML += 
      `<div class="card">✔ ${item}</div>`;
  });

  data.benefits.forEach(item => {
    document.getElementById('benefits').innerHTML += 
      `<div class="card">✔ ${item}</div>`;
  });

  data.testimonials.forEach(t => {
    document.getElementById('testimonials').innerHTML += 
      `<div class="card testimonial">
        <img src="${t.image}">
        <div>⭐⭐⭐⭐⭐<br>${t.caption}</div>
      </div>`;
  });

  document.getElementById('priceOld').innerText = data.priceOld;
  document.getElementById('priceNow').innerText = data.priceNow;

});
</script>

</body>
</html>
