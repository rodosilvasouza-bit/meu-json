<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oferta Especial</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 28px;
  line-height: 1.3;
}

.section {
  margin: 30px 0;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.btn {
  display: block;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  color: white;
  padding: 18px;
  text-align: center;
  font-weight: bold;
  border-radius: 8px;
  text-decoration: none;
  font-size: 18px;
}

.price-old {
  text-decoration: line-through;
  color: #94a3b8;
}

.price-now {
  font-size: 32px;
  color: #22c55e;
  font-weight: bold;
}

.highlight {
  color: #22c55e;
  font-weight: bold;
}

.testimonial {
  display: flex;
  align-items: center;
  gap: 10px;
}

.testimonial img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
}

.badge {
  background: #22c55e;
  color: #000;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  display: inline-block;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="badge">OFERTA LIMITADA</div>

<h1 id="title"></h1>

<a id="ctaTop" class="btn" target="_blank"></a>

<div class="section">
<h3>Você se identifica com isso?</h3>
<div id="painPoints"></div>
</div>

<div class="section">
<h3>O que você vai conquistar:</h3>
<div id="features"></div>
</div>

<div class="section">
<h3>Quem já aplicou:</h3>
<div id="testimonials"></div>
</div>

<div class="section card">
<p class="price-old" id="priceOld"></p>
<p class="price-now" id="priceNow"></p>
<a id="ctaBottom" class="btn" target="_blank"></a>
</div>

<div class="section">
<h3>Benefícios:</h3>
<div id="benefits"></div>
</div>

</div>

<script>
fetch('dados.json')
.then(res => res.json())
.then(data => {

  document.getElementById('title').innerHTML = data.title;

  document.getElementById('ctaTop').innerText = data.ctaText;
  document.getElementById('ctaTop').href = data.ctaLink;

  document.getElementById('ctaBottom').innerText = data.ctaText;
  document.getElementById('ctaBottom').href = data.ctaLink;

  data.painPoints.forEach(item => {
    document.getElementById('painPoints').innerHTML += 
      `<div class="card">${item}</div>`;
  });

  data.features.forEach(item => {
    document.getElementById('features').innerHTML += 
      `<div class="card">✔ ${item}</div>`;
  });

  data.benefits.forEach(item => {
    document.getElementById('benefits').innerHTML += 
      `<div class="card">✔ ${item}</div>`;
  });

  data.testimonials.forEach(t => {
    document.getElementById('testimonials').innerHTML += 
      `<div class="card testimonial">
        <img src="${t.image}">
        <div>${t.caption}</div>
      </div>`;
  });

  document.getElementById('priceOld').innerText = data.priceOld;
  document.getElementById('priceNow').innerText = data.priceNow;

});
</script>

</body>
</html>
